[package]
name = "local-youtube-dub-host"
version = "0.3.0"
edition = "2021"

[dependencies]
base64 = "0.21"
serde_json = "1.0"
# HTTP to Ollama and llama-server on 127.0.0.1 only: no TLS, no compression.
ureq = { version = "3", default-features = false }
# The per-session key llama-server is started with.
getrandom = "0.4"

# Job Objects, so a worker's whole process tree dies with it (process_tree.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
